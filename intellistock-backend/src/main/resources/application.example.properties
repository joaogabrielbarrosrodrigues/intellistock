# Copie estes valores para variaveis de ambiente do seu terminal ou da plataforma.
# Nao versione um application-local.properties com credenciais reais.
DB_URL=jdbc:postgresql://localhost:5432/intellistock
DB_USERNAME=postgres
DB_PASSWORD=defina-uma-senha-local
# Use no minimo 32 caracteres aleatorios. Exemplo (PowerShell):
# [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))
JWT_SECRET=defina-um-segredo-aleatorio-com-ao-menos-32-caracteres
JWT_EXPIRATION_MINUTES=120
CORS_ALLOWED_ORIGINS=http://localhost:8081,http://localhost:19006
# Somente em desenvolvimento local; producao usa validate.
SPRING_PROFILES_ACTIVE=dev
