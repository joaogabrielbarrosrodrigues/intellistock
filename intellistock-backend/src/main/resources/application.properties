spring.application.name=intellistock-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/intellistock
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
