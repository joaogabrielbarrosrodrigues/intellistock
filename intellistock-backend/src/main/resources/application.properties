spring.application.name=intellistock-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/intellistock}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

## `validate` protects production data. Local schema updates are opt-in with the `dev` profile.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Origens liberadas para CORS (separadas por virgula). Apps nativos nao usam CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Parametros padrao da analise de consumo e sugestao de reposicao
app.analise.dias-analise=30
app.analise.dias-cobertura=30
app.analise.prazo-entrega-dias=7
app.analise.dias-seguranca=7
app.analise.limiar-tendencia-percentual=10
